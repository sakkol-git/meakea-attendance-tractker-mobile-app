name: Generate Linux visual references
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read repository Flutter pin
        id: sdk
        run: python3 -c 'import json,os; open(os.environ["GITHUB_OUTPUT"], "a").write("version=" + json.load(open(".fvmrc"))["flutter"] + "\n")'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/visual_test.dart --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: linux-visual-references
          path: test/goldens/linux
          if-no-files-found: error
